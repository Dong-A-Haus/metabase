# Đông A's only workflow (DONGA.md): upstream's workflows are removed on this branch.
#
# test    runs the tests of Đông A's change (metabase.sso.api.donga-test) on OSS Metabase.
# uberjar builds metabase.jar with Metabase's own build script (./bin/build.sh), then starts it and checks that
#         /auth/donga is there and refuses a request that did not come through the door.
# image   puts that jar into upstream's own image for this version (donga/Dockerfile) for linux/amd64 and
#         linux/arm64, and pushes ghcr.io/dong-a-haus/metabase:v0.65.2-donga.<run>, labelled with this commit.
# release publishes the same jar, its sha256 and donga/Dockerfile as the GitHub release v0.65.2-donga.<run> at this
#         commit. This repo is public, so Eric's Mini downloads them with no login, checks the sha256 that donga-os
#         pins, and builds the image itself (the ghcr package is private, and a box should not hold a GitHub token).
#
# No secret is used or stored: the image and the release are published with this run's GITHUB_TOKEN, and the door secret in the start
# check is a throwaway made by the job.
name: Đông A build

on:
  push:
    branches: [donga/v0.65.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donga-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_VERSION: v0.65.2
  IMAGE: ghcr.io/dong-a-haus/metabase

jobs:
  test:
    name: test (metabase.sso.api.donga-test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
        with:
          java-version: "25"
      - name: Run the tests of Đông A's change
        shell: bash
        run: |
          set -o pipefail
          ./bin/test-agent --oss :only '[metabase.sso.api.donga-test]' | tee "$RUNNER_TEMP/test.log"
          # a run that found no tests passes quietly; it must not count
          grep -Eq '^Ran [1-9][0-9]* tests' "$RUNNER_TEMP/test.log"
          grep -Eq '[0-9]+ assertions, 0 failures, 0 errors' "$RUNNER_TEMP/test.log"

  uberjar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MB_EDITION: oss
      INTERACTIVE: "false"
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v7
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
        with:
          java-version: "25"
      - name: Build the uberjar (Metabase's own build script)
        run: ./bin/build.sh "{:version \"${UPSTREAM_VERSION}-donga.${{ github.run_number }}\"}"
      - name: Start it; /auth/donga is there and refuses anyone the door did not send
        shell: bash
        run: |
          set -euo pipefail
          export MB_DONGA_DOOR_SECRET="$(openssl rand -hex 32)"
          java --add-opens java.base/java.nio=ALL-UNNAMED -jar target/uberjar/metabase.jar > "$RUNNER_TEMP/mb.log" 2>&1 &
          for _ in $(seq 1 300); do
            curl -fs http://localhost:3000/api/health | grep -q '"ok"' && break
            sleep 1
          done
          curl -fs http://localhost:3000/api/health | grep -q '"ok"' || { tail -50 "$RUNNER_TEMP/mb.log"; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -H 'X-Donga-User: a' -H 'X-Donga-Email: a@b.test' http://localhost:3000/auth/donga)" = 403
          test "$(code -H 'X-Donga-Door: wrong' http://localhost:3000/auth/donga)" = 403
          test "$(code -H "X-Donga-Door: $MB_DONGA_DOOR_SECRET" http://localhost:3000/auth/donga)" = 400
          echo "ok: /auth/donga refuses without the door (403) and asks who (400) with it"
      - uses: actions/upload-artifact@v7
        with:
          name: metabase-jar
          path: target/uberjar/metabase.jar
          if-no-files-found: error
          retention-days: 14

  image:
    needs: [test, uberjar]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: metabase-jar
          path: ${{ runner.temp }}/image
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/image
          file: donga/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.UPSTREAM_VERSION }}-donga.${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=Đông A's Metabase
            org.opencontainers.image.description=Metabase ${{ env.UPSTREAM_VERSION }} with Đông A OS sign-in (DONGA.md)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.UPSTREAM_VERSION }}-donga.${{ github.run_number }}
            org.opencontainers.image.base.name=docker.io/metabase/metabase:${{ env.UPSTREAM_VERSION }}
            org.opencontainers.image.licenses=AGPL-3.0
      - name: Record the image
        run: |
          {
            echo "### Image"
            echo
            echo "\`${IMAGE}:${UPSTREAM_VERSION}-donga.${{ github.run_number }}@${{ steps.push.outputs.digest }}\`"
            echo
            echo "Fork commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [test, uberjar]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: metabase-jar
          path: ${{ runner.temp }}/release
      - name: Publish the jar, its sha256 and the Dockerfile as release v0.65.2-donga.<run>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.UPSTREAM_VERSION }}-donga.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          cp "$GITHUB_WORKSPACE/donga/Dockerfile" Dockerfile
          sha256sum metabase.jar > metabase.jar.sha256
          sum=$(cut -d' ' -f1 metabase.jar.sha256)
          {
            echo "Metabase ${UPSTREAM_VERSION} with Đông A OS sign-in (DONGA.md), fork commit ${GITHUB_SHA}."
            echo
            echo "metabase.jar sha256: \`${sum}\`"
            echo
            echo "Build the image from these two files: \`docker build -t donga/metabase:${TAG} .\` in a folder holding"
            echo "metabase.jar and Dockerfile. donga-os infra/metabase/setup.sh does this on the box after checking the sha256."
          } > notes.md
          gh release create "$TAG" metabase.jar metabase.jar.sha256 Dockerfile \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "\`$TAG\`, metabase.jar sha256 \`$sum\`" >> "$GITHUB_STEP_SUMMARY"
